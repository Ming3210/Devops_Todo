version: "3"

services:

  frontend:
    build: .
    ports:
      - "3000:80"

  json-server:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install -g json-server && json-server --watch db.json --host 0.0.0.0 --port 3001"
    ports:
      - "3001:3001"
